# .github/workflows/uvrn-validate.yml
name: UVRN – Validate & Sign Receipts

on:
  pull_request:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'cli/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [ main ]
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'cli/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Schemas & Receipts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Schema validation (glob examples)
        run: |
          pnpm validate \
            -s schemas/receipt.v0.1.schema.json \
            -d "examples/receipts/**/*.json"

      - name: Run unit tests (if present)
        run: pnpm -s test --if-present

  sign-receipt:
    name: Emit Signed Receipt (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # ⚠️ Replace the script/command below with your actual signing implementation.
      # It should output a JSON receipt to ./dist/uvrn-receipt.json and return non-zero on failure.
      - name: Generate & sign receipt
        env:
          UVRN_SIGNING_PRIVATE_KEY: ${{ secrets.UVRN_SIGNING_PRIVATE_KEY }}
        run: |
          pnpm -s run sign:receipt || node scripts/emit-signed-receipt.mjs

      - name: Attach receipt to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: uvrn-receipt-${{ github.run_id }}
          path: |
            dist/uvrn-receipt.json
          if-no-files-found: error
